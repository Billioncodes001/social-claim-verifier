[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-verifier"
version = "0.1.0"
description = "Evidence-backed multi-agent review workspace"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "cryptography>=44", "beautifulsoup4>=4.13,<5", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
claim-verifier = "verifier.cli:main"
claim-verifier-connect = "verifier.connectors:main"

[tool.setuptools.packages.find]
include = ["verifier*"]

[tool.setuptools.package-data]
verifier = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
